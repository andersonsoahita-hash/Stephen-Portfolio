<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stephen Anderson Soahita · Community manager & contenu</title>
<meta name="description" content="Stephen Anderson Soahita, community manager et créateur de contenu, en recherche d’une alternance de deux ans en Île-de-France. Réalisations, chiffres, expériences et comptes Instagram, TikTok, Facebook.">
<meta name="theme-color" content="#0B2545">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B2545;--navy2:#13315C;--deep:#071a33;--gold:#C9A24B;--gold-d:#946F22;--ivory:#F5F3EE;--mut:#a9b4c8}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:auto}
body{background:var(--deep);color:#ECE8DD;font-family:Inter,system-ui,sans-serif;line-height:1.6;overflow-x:hidden}
.serif{font-family:Fraunces,Georgia,serif}
a{color:inherit}
/* nav */
nav{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:14px 4vw;background:linear-gradient(to bottom,rgba(7,26,51,.92),rgba(7,26,51,0));transition:background .3s}
nav.solid{background:rgba(7,26,51,.96);backdrop-filter:blur(8px);box-shadow:0 1px 0 rgba(201,162,75,.18)}
nav .brand{font-family:Fraunces,serif;font-weight:600;font-size:18px;color:var(--gold);letter-spacing:.02em;text-decoration:none}
nav ul{display:flex;gap:22px;list-style:none}
nav ul a{font-size:13px;text-decoration:none;color:#d9dfeb;opacity:.85}
nav ul a:hover{color:var(--gold);opacity:1}
@media(max-width:860px){nav ul{display:none}}
/* hero */
.hero{position:relative;min-height:100vh;display:flex;align-items:center;padding:120px 4vw 60px;background:linear-gradient(160deg,var(--navy2),var(--deep) 70%);overflow:hidden}
.hero .photo{position:absolute;right:0;top:0;bottom:0;width:min(52vw,720px)}
.hero .photo img{width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.hero .photo:after{content:"";position:absolute;inset:0;background:linear-gradient(to right,var(--navy2) 0%,rgba(19,49,92,.0) 45%),linear-gradient(to top,var(--deep) 0%,rgba(7,26,51,0) 30%)}
.hero .txt{position:relative;z-index:2;max-width:640px}
.kick{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}
h1{font-family:Fraunces,serif;font-weight:600;font-size:clamp(44px,7vw,92px);line-height:.98;letter-spacing:-.02em;color:#fff;margin:18px 0 22px}
.hero p.q{font-family:Fraunces,serif;font-style:italic;font-size:clamp(18px,2.2vw,26px);color:#ECE8DD;max-width:30ch;line-height:1.35}
.hero p.q b{color:var(--gold);font-weight:500}
.hero .words{margin-top:26px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);font-weight:600}
.btns{display:flex;gap:12px;margin-top:34px;flex-wrap:wrap}
.btn{border:0;cursor:pointer;font:600 14px Inter,sans-serif;padding:13px 26px;border-radius:6px;text-decoration:none;display:inline-block}
.btn.gold{background:var(--gold);color:#0B2545}.btn.gold:hover{background:#d9b25b}
.btn.ghost{background:rgba(255,255,255,.1);color:#fff}.btn.ghost:hover{background:rgba(255,255,255,.18)}
@media(max-width:860px){.hero{align-items:flex-end;padding-top:40vh}.hero .photo{width:100%;height:62vh;bottom:auto}.hero .photo:after{background:linear-gradient(to top,var(--navy2) 5%,rgba(19,49,92,0) 70%)}}
/* rows */
main{position:relative;margin-top:0;z-index:3}
section.row{padding:34px 0 10px;scroll-margin-top:60px}
.rh{padding:0 4vw;display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.rh h2{font-family:Fraunces,serif;font-weight:600;font-size:clamp(24px,3vw,34px);color:#fff}
.rh span{font-size:13.5px;color:var(--mut)}
.rail{position:relative}
.track{display:flex;gap:14px;overflow-x:auto;padding:18px 4vw 30px;scroll-snap-type:x proximity;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.arr{position:absolute;top:50%;transform:translateY(-60%);z-index:5;width:44px;height:90px;border:0;cursor:pointer;color:#fff;font-size:26px;background:rgba(7,26,51,.75);opacity:0;transition:.2s;border-radius:6px}
.rail:hover .arr{opacity:1}
.arr.l{left:1vw}.arr.r{right:1vw}
@media(hover:none){.arr{display:none}}
.card{flex:none;width:clamp(170px,19vw,230px);aspect-ratio:2/3;border-radius:10px;overflow:hidden;position:relative;cursor:pointer;scroll-snap-align:start;border:1px solid rgba(255,255,255,.08);transition:transform .25s,box-shadow .25s;background:var(--navy);text-align:left;color:inherit;font:inherit;padding:0}
.card:hover,.card:focus-visible{transform:translateY(-6px) scale(1.04);box-shadow:0 14px 30px -10px rgba(0,0,0,.7),0 0 0 1px var(--gold);outline:none;z-index:2}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(7,26,51,.95) 0%,rgba(7,26,51,.35) 45%,rgba(7,26,51,0) 70%)}
.card .cap{position:absolute;left:0;right:0;bottom:0;padding:14px 14px 16px}
.card .tag{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:600}
.card .ttl{font-family:Fraunces,serif;font-weight:600;font-size:19px;line-height:1.15;color:#fff;margin-top:4px}
.card.typo{display:flex;flex-direction:column;justify-content:space-between;padding:16px}
.card.typo .big{font-family:Fraunces,serif;font-weight:600;font-size:54px;line-height:.95;color:rgba(255,255,255,.92);letter-spacing:-.02em}
.card.typo .big.s{font-size:34px}
.card.typo .cap{position:static;padding:0}
.card.app img{object-position:0% 0%}
.st{position:absolute;top:10px;left:10px;z-index:3;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:99px;background:rgba(7,26,51,.82);color:#ECE8DD;border:1px solid rgba(201,162,75,.45)}
.st.prep{color:var(--gold)}
.cat{padding:80px 4vw 10px;border-top:1px solid rgba(201,162,75,.18);margin-top:30px;scroll-margin-top:50px}
.cat h2{font-family:Fraunces,serif;font-weight:600;font-size:clamp(34px,5.4vw,64px);color:#fff;line-height:1.02;margin:8px 0 6px}
.cat p{color:var(--mut);font-size:15px}
.sheet h4{font-family:Fraunces,serif;font-size:18px;color:var(--gold);font-weight:600;margin:18px 0 6px}

#bar{position:absolute;left:0;bottom:0;height:2px;background:var(--gold);width:0}
nav ul a.on{color:var(--gold);opacity:1;border-bottom:1px solid var(--gold);padding-bottom:3px}
.cat{max-width:1100px;margin:0 auto;padding:110px 5vw 10px}
.cat .intro{font-size:clamp(17px,1.6vw,20px);line-height:1.7;color:#d9dfeb;max-width:62ch;margin-top:12px}
.part{max-width:1100px;margin:0 auto;padding:40px 5vw 10px}
.ph{border-bottom:1px solid rgba(201,162,75,.25);padding-bottom:12px;margin-bottom:34px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.ph h3{font-family:Fraunces,serif;font-weight:600;font-size:clamp(24px,3vw,32px);color:#fff}
.ph span{color:var(--mut);font-size:14px}
.art{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:start;margin-bottom:64px}
.art.alt{grid-template-columns:minmax(0,1fr) minmax(0,340px)}
.art.alt .vis{order:2}
.art .vis{position:sticky;top:90px;margin:0;border-radius:12px;overflow:hidden;box-shadow:0 18px 40px -16px rgba(0,0,0,.7)}
.art .vis img{display:block;width:100%;height:auto}
.vis.typo{aspect-ratio:3/4;padding:26px;display:flex;flex-direction:column;justify-content:space-between}
.vis.typo .big{font-family:Fraunces,serif;font-weight:600;font-size:clamp(54px,7vw,86px);line-height:.95;color:#fff;letter-spacing:-.02em}
.vis.typo .big.s{font-size:clamp(36px,4.4vw,56px)}
.vis.typo.bgp .big{text-shadow:0 2px 18px rgba(0,0,0,.55)}
.vis.typo.bgp figcaption{text-shadow:0 1px 8px rgba(0,0,0,.7)}
.vis.typo figcaption{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.75);font-weight:600}
.vis.phone{border-radius:28px;border:5px solid #050f20;max-width:300px}
.vis.phone.wide{border-radius:10px;max-width:none}
.vis.contain{background:#FAF8F4;padding:20px}
.txt2 .t{font-family:Fraunces,serif;font-weight:600;font-size:clamp(28px,3.6vw,42px);line-height:1.08;color:#fff;margin:6px 0 12px}
.badge{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:99px;border:1px solid rgba(201,162,75,.55);color:var(--gold);margin-bottom:18px}
.badge.prep{background:rgba(201,162,75,.14)}
.txt2 p{font-size:17px;line-height:1.75;color:#e1e6f1;margin-bottom:14px;max-width:66ch}
.txt2 h4:not(.t){font-family:Fraunces,serif;font-size:20px;color:var(--gold);font-weight:600;margin:24px 0 6px}
.txt2 ul{margin:8px 0 16px 20px;font-size:16.5px;line-height:1.7;color:#e1e6f1}
.txt2 li{margin-bottom:6px}
.facts{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}
.facts div{flex:1 1 120px;max-width:200px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:14px 16px}
.facts b{display:block;font-family:Fraunces,serif;font-size:32px;color:var(--gold);font-weight:600;line-height:1.1}
.facts span{font-size:13px;color:var(--mut)}
.more{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:20px}
.more img{width:100%;border-radius:8px}
@media(max-width:820px){
 .art,.art.alt{grid-template-columns:1fr}
 .art.alt .vis{order:0}
 .art .vis{position:static;max-width:420px}
 .vis.phone{max-width:260px}
 .vis.typo{aspect-ratio:16/9}
  .cat{padding-top:80px}
}
.logos{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.logos img.dk{background:#1E2E40}
.logos img{height:58px;width:auto;background:#fff;border-radius:8px;padding:6px 10px;display:block}
/* fil rouge */
.thread{padding:70px 4vw 40px;text-align:center}
.thread h2{font-family:Fraunces,serif;font-size:clamp(30px,5vw,56px);color:#fff;font-weight:600}
.thread h2 em{color:var(--gold);font-style:italic;font-weight:500}
.tri{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;max-width:1100px;margin:34px auto 0;text-align:left}
.tri div{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-top:3px solid var(--gold);border-radius:10px;padding:22px}
.tri b{font-family:Fraunces,serif;font-size:24px;color:var(--gold);display:block;margin-bottom:8px;font-weight:600}
.tri p{font-size:14.5px;color:#d6dcea}
.quote{margin:46px auto 0;max-width:30ch;font-family:Fraunces,serif;font-style:italic;font-size:clamp(20px,3vw,30px);line-height:1.35;color:#ECE8DD}
.quote b{color:var(--gold);font-weight:500}
/* contact */
footer{padding:50px 4vw 60px;display:flex;gap:34px;flex-wrap:wrap;align-items:center;justify-content:center;border-top:1px solid rgba(255,255,255,.07);margin-top:50px}
footer .qr{display:flex;gap:14px;align-items:center;text-decoration:none}
footer .qr img{width:92px;height:92px;background:#fff;padding:6px;border-radius:8px}
footer .qr span{font-size:13px;color:var(--mut)}footer .qr b{display:block;color:#fff;font-weight:600}
.small{text-align:center;font-size:12px;color:#7f8aa3;padding:0 4vw 40px}
/* modal */
dialog{border:0;background:transparent;max-width:none;max-height:none;width:100%;height:100%;padding:0;color:inherit}
dialog::backdrop{background:rgba(3,10,22,.82);backdrop-filter:blur(4px)}
.sheet{position:relative;margin:4vh auto;width:min(980px,94vw);max-height:92vh;overflow:auto;background:linear-gradient(170deg,var(--navy2),var(--navy));border-radius:14px;border:1px solid rgba(201,162,75,.3);box-shadow:0 30px 80px rgba(0,0,0,.7);display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr)}
.sheet .vis{background:#050f20;display:flex;align-items:center;justify-content:center;min-height:300px;position:relative}
.sheet .vis img{width:100%;height:100%;object-fit:cover;max-height:92vh}
.sheet .vis.contain img{object-fit:contain;padding:18px}
.sheet .vis.typo{background:linear-gradient(150deg,var(--c1),var(--c2));padding:30px;align-items:flex-end;justify-content:flex-start}
.sheet .vis.typo .big{font-family:Fraunces,serif;font-weight:600;font-size:clamp(48px,8vw,84px);line-height:.95;color:#fff;letter-spacing:-.02em}
.sheet .body{padding:34px 34px 34px}
.sheet h3{font-family:Fraunces,serif;font-weight:600;font-size:clamp(28px,4vw,40px);line-height:1.08;color:#fff;margin:6px 0 10px}
.sheet .badge{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:99px;border:1px solid rgba(201,162,75,.55);color:var(--gold);margin-bottom:14px}
.sheet p{font-size:15px;color:#d9dfeb;margin-bottom:12px}
.facts{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.facts div{flex:1 1 90px;background:rgba(255,255,255,.06);border-radius:8px;padding:10px 12px}
.facts b{display:block;font-family:Fraunces,serif;font-size:26px;color:var(--gold);font-weight:600;line-height:1.1}
.facts span{font-size:12px;color:var(--mut)}
.sheet ul{margin:6px 0 12px 18px;font-size:14.5px;color:#d9dfeb}
.sheet li{margin-bottom:4px}
.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.x{position:absolute;top:12px;right:14px;z-index:6;width:38px;height:38px;border-radius:50%;border:0;background:rgba(7,26,51,.8);color:#fff;font-size:20px;cursor:pointer}
.sheet .more{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.sheet .more img{width:100%;border-radius:8px;border:1px solid rgba(255,255,255,.1)}
@media(max-width:760px){.sheet{grid-template-columns:1fr;margin:2vh auto;max-height:96vh}.sheet .vis{max-height:42vh}.sheet .body{padding:22px}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* ===== v3 : pages, mouvement ===== */
#app{min-height:100vh}
.page{animation:pgin .55s cubic-bezier(.2,.7,.2,1) both}
@keyframes pgin{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.rv{opacity:0;transform:translateY(26px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}.page{animation:none}*{scroll-behavior:auto!important}}
nav ul a{position:relative}
nav ul a:after{content:"";position:absolute;left:0;bottom:-4px;height:1px;width:0;background:var(--gold);transition:width .3s}
nav ul a:hover:after,nav ul a.on:after{width:100%}
nav ul a.on{border-bottom:0;padding-bottom:0}
/* hero animé */
.hero .photo img{transform:scale(1.08);animation:kb 18s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.16) translate(-1.5%,1%)}}
.hero:before{content:"";position:absolute;width:60vmax;height:60vmax;left:-20vmax;top:-25vmax;background:radial-gradient(circle,rgba(201,162,75,.16),rgba(201,162,75,0) 60%);animation:glow 9s ease-in-out infinite alternate;pointer-events:none}
@keyframes glow{to{transform:translate(8vmax,6vmax)}}
.hero h1{background:linear-gradient(100deg,#fff 40%,#e9cf8f 55%,#fff 70%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s ease-in-out infinite}
@keyframes shine{0%,20%{background-position:100% 0}60%,100%{background-position:0 0}}
.scrollhint{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--mut);z-index:3;display:flex;flex-direction:column;align-items:center;gap:8px}
.scrollhint:after{content:"";width:1px;height:34px;background:linear-gradient(var(--gold),transparent);animation:drop 1.8s infinite}
@keyframes drop{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
/* tuiles chapitres */
.homechap{max-width:1240px;margin:0 auto;padding:90px 4vw 20px}
.homechap>h2{font-family:Fraunces,serif;font-weight:600;font-size:clamp(30px,4.6vw,54px);color:#fff;margin:8px 0 34px}
.chaps{display:grid;grid-template-columns:repeat(6,1fr);gap:16px}
.chap{position:relative;overflow:hidden;border-radius:14px;min-height:300px;text-decoration:none;color:#fff;display:flex;align-items:flex-end;border:1px solid rgba(255,255,255,.08);grid-column:span 2;isolation:isolate;transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s,border-color .35s}
.chap:nth-child(1),.chap:nth-child(2){grid-column:span 3;min-height:380px}
.chap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transition:transform 1.1s cubic-bezier(.2,.7,.2,1)}
.chap:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(to top,rgba(7,26,51,.96) 6%,rgba(7,26,51,.5) 45%,rgba(7,26,51,.1) 80%);transition:opacity .4s}
.chap:hover{transform:translateY(-6px);border-color:var(--gold);box-shadow:0 24px 50px -20px rgba(0,0,0,.8),0 0 0 1px var(--gold)}
.chap:hover img{transform:scale(1.08)}
.chap .in{padding:22px 24px 24px;width:100%}
.chap .num{font-family:Fraunces,serif;font-style:italic;color:var(--gold);font-size:15px;letter-spacing:.06em}
.chap h3{font-family:Fraunces,serif;font-weight:600;font-size:clamp(24px,2.6vw,34px);line-height:1.05;margin:4px 0 6px}
.chap p{font-size:14px;color:#d9dfeb;max-width:34ch}
.chap .go{display:inline-block;margin-top:12px;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);transition:transform .3s}
.chap:hover .go{transform:translateX(6px)}
@media(max-width:900px){.chaps{grid-template-columns:1fr 1fr}.chap,.chap:nth-child(1),.chap:nth-child(2){grid-column:span 1;min-height:260px}}
@media(max-width:560px){.chaps{grid-template-columns:1fr}.chap,.chap:nth-child(1),.chap:nth-child(2){min-height:230px}}
.tri div img{display:block;width:calc(100% + 44px);margin:-22px -22px 18px;height:190px;object-fit:cover;border-radius:7px 7px 0 0}
.proof img{display:block;width:100%;border-radius:8px;border:1px solid rgba(255,255,255,.14);box-shadow:0 14px 34px -16px rgba(0,0,0,.7);margin-top:8px;background:#fff}
/* bandeau Tekwin */
.tkband{max-width:1240px;margin:50px auto 0;padding:0 4vw}
.tkband a{display:grid;grid-template-columns:minmax(0,300px) 1fr;gap:clamp(20px,4vw,50px);align-items:center;padding:20px;border-radius:16px;text-decoration:none;color:#fff;background:linear-gradient(120deg,var(--navy2),var(--navy));border:1px solid rgba(201,162,75,.3);transition:.3s}
.tkband a:hover{border-color:var(--gold);transform:translateY(-4px)}
.tkband img{width:100%;aspect-ratio:4/3;object-fit:cover;object-position:50% 25%;border-radius:12px}
.tkband h3{font-family:Fraunces,serif;font-weight:600;font-size:clamp(26px,4vw,44px);line-height:1.05;margin:8px 0}
.tkband p{color:#d9dfeb;max-width:50ch}
.tkband .go{display:inline-block;margin-top:14px;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
@media(max-width:700px){.tkband a{grid-template-columns:1fr}}
/* page chapitre */
.chead{position:relative;padding:150px 5vw 56px;overflow:hidden;isolation:isolate}
.chead img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;opacity:.5;object-position:50% 25%}
.chead:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(to bottom,rgba(7,26,51,.55),var(--deep) 98%)}
.chead .wrap{max-width:1100px;margin:0 auto}

<h1>Stephen<br>Anderson<br>Soahita</h1>
<p class="q">Je crée des contenus et j’anime des communautés. Sur la page d’un centre de formation, cela a donné <b>+509 followers et 19 000 vues en 28 jours</b>.</p>
<div class="words">Je filme, je monte et je photographie moi-même.</div>
<div class="btns"><a class="btn gold" href="#/c/realisations">Voir mes réalisations</a><a class="btn ghost" href="#/contact">Proposer un entretien</a></div>

<div class="kick">Façon de travailler</div>
<h2 class="serif">Générosité, entraide, <em>élévation.</em></h2>
<div class="tri">
<div><img loading="lazy" decoding="async" src="img/noel_meals.jpg" alt="Repas partagé à Noël avec Isc’America"><b>Générosité</b><p>Plus de 70 repas partagés à Noël avec Isc’America, deux années de suite. Quand un projet me plaît, je donne mon temps sans compter.</p></div>
<div><img loading="lazy" decoding="async" src="img/ref_equipe.jpg" alt="" style="object-position:50% 30%"><b>Entraide</b><p>J’ai été élève référent pendant deux ans, puis conseiller de mon successeur à la tête de l’association. J’ai laissé un guide et une fiche de poste à celui qui me remplace chez Tekwin.</p></div>
<div><img loading="lazy" decoding="async" src="img/elevation.jpg" alt="Stephen Anderson Soahita" style="object-position:50% 18%"><b>Élévation</b><p>J’apprends en continu : un master en marketing, un coaching d’art oratoire depuis août 2025, la photo, la vidéo et le slam.</p></div>
</div>
<p class="quote">Grandir, ce n’est pas plaire en devenant un autre. C’est être utile en <b>restant soi.</b></p>
</section></template>

const ROWS=[{"id":"cm","cat":"realisations","title":"Les pages que je fais vivre","sub":"Speak Up English Institute et Man in the Shadow","items":[{"id":"speakup","bg":"q01.jpg","pos":"50% 30%","logos":["speakup"],"tag":"Community manager · en cours","title":"Speak Up English Institute","big":"Speak<br>Up","c":["#2F8F96","#0B2545"],"st":"En cours","body":["Speak Up English Institute est un centre de formation en anglais à Antananarivo. J’y suis community manager : je crée et publie les contenus de la page Facebook, et je réponds aux messages. La première rentrée a eu lieu en octobre 2026.","## Ce que disent les statistiques","Sur 28 jours, j’ai publié 15 contenus : 10 stories, 3 photos et 2 reels. Ils ont totalisé 19 000 vues, dont 97 % venant de personnes qui ne suivaient pas encore la page. La page a gagné 509 followers (+597 %) pour atteindre 586, et les interactions sont montées à 875 (+282 %). Tous ces chiffres viennent des statistiques de la page.","## Les messages","37 conversations en messages privés, avec un taux de réponse de 95 %."],"facts":[["19 000","vues en 28 jours"],["97 %","vues hors abonnés"],["+509","followers (+597 %)"],["95 %","messages répondus"]]},{"id":"mits","tag":"Photographie · Instagram · TikTok","title":"Man in the Shadow","img":"louvre.jpg","st":"En ligne","body":["Je photographie Paris : la rue, le portrait, la nature et le paysage, toujours avec mon trépied. Ma signature : « Un regard discret sur les détails du quotidien ». Mon idée est de révéler ce qui est beau mais que l’on ne regarde pas, et de raconter une histoire ou une émotion.","## Le site","J’ai créé moi-même ce site : soixante-dix-sept images en cinq chapitres, aussi disponible en application installable.","## L’audience","Je l’ai construite avec des publications régulières sur Instagram et TikTok. Un post a touché 213 comptes (79,2 % hors abonnés) et une vidéo a réuni 1 841 vues. Ce sont des chiffres modestes, et je les présente tels quels."],"facts":[["77","images"],["213","comptes touchés sur un post"],["1 841","vues sur une vidéo"]],"links":[["Ouvrir le site","https://andersonsoahita-hash.github.io/Man-In-The-Shadow/"],["Instagram","https://www.instagram.com/man.in_the_shadow/"],["TikTok","https://www.tiktok.com/@the.man.in.theshadow"]],"gallery":["sacre.jpg","rooftops.jpg","stairs.jpg","verticale.jpg"]}]},{"id":"video","cat":"realisations","title":"Ce que je tourne et monte","sub":"Caméra, trépied et montage : tout est fait par moi","items":[{"st":"À la une","id":"temoignage","file":"coach.mp4","poster":"temoignage.jpg","img":"elevation.jpg","vertical":true,"tag":"Vidéo · témoignage","title":"Mon coaching en art oratoire","body":["J’ai filmé ce témoignage pour mon coach d’art oratoire, qui m’accompagne actuellement pour mieux m’exprimer.","Format vertical, tourné en extérieur avec un micro-cravate."],"video":["coach.mp4","temoignage.jpg"]},{"id":"alternance","img":"tekwin_alternance.jpg","logos":["tekwin","accelis"],"tag":"Vidéo · Tekwin","title":"Mon alternance chez Tekwin","st":"Nouveau","video":["tekwin_alternance.mp4","tekwin_alternance.jpg"],"body":["Une vidéo sur mon alternance chez Tekwin, où je suis assistant chef de projet IT, de juillet 2025 à septembre 2026.","Elle n’avait pas été publiée avant ce portfolio."]},{"id":"ferrieres","tag":"Film · 43 secondes","title":"Ferrières-en-Brie","img":"poster_ferrieres.jpg","st":"Terminé","body":["Un film personnel de quarante-trois secondes sur Ferrières-en-Brie, que j’ai tourné et monté sur CapCut."],"video":["ferrieres.mp4","poster_ferrieres.jpg"]},{"st":"Terminé","id":"arc","file":"arc.mp4","poster":"arc.jpg","img":"arc.jpg","tag":"Vidéo · 36 secondes","title":"Paris, du haut de l’Arc de Triomphe","body":["J’ai pris cette vidéo depuis le haut de l’Arc de Triomphe et je l’ai montée moi-même. Elle montre Paris sous un autre angle, en cinq temps.","## Les plans","Tout s’ouvre sur le titre « PARIS » et une phrase en anglais qui s’écrit sur les toits, avec la tour Eiffel au loin.","La caméra plonge ensuite vers l’avenue : les voitures, les passants sur les passages piétons, les arbres jaunes de l’automne.","À l’horizon apparaissent La Défense et la Grande Arche. Plus près, les toits de zinc et les façades haussmanniennes, à hauteur de feuillage.","Le dernier plan suit l’avenue qui file droit vers la tour Eiffel, sous un ciel bleu.","## Mon regard","Pas de visage, pas de commentaire : seulement la ville, le rythme des plans et quelques mots à l’écran."],"video":["arc.mp4","arc.jpg"]},{"st":"Terminé","id":"montage","file":"montage.mp4","poster":"montage.jpg","img":"montage.jpg","tag":"Vidéo · 35 secondes","title":"Vers l’établissement","body":["Dans cette courte vidéo, je marche vers mon établissement. Je l’ai montée sur CapCut, avec des titres superposés aux images.","## Le trajet","Plan large sur le parking : ma silhouette avance vers le bâtiment en bois sombre, et le titre « STEPHEN » s’inscrit à l’image.","Casque sur les oreilles, je traverse le parking dans la lumière de fin de journée, une voiture blanche au premier plan.","## Les gros plans","Mes pas, de très près : pantalon camel, baskets, pavés devant la porte vitrée. Le rythme du montage suit celui de ma marche.","Sur la vitre, le logo 89 de « L’École supérieure du numérique ».","## L’arrivée","Le bâtiment en plan large, entre les arbres, au coucher du soleil, puis le panneau à l’entrée. Fin du trajet."],"video":["montage.mp4","montage.jpg"]},{"id":"tk5","bg":"deeptech.jpg","pos":"45% 40%","logos":["tekwin"],"tag":"Vidéo & LinkedIn · Tekwin","title":"LinkedIn & Deep Tech Talk","big":"Deep<br>Tech","small":1,"c":["#13315C","#071a33"],"st":"Vidéo publiée","body":["J’ai filmé et monté la vidéo du Deep Tech Talk de l’École 89 Deep Tech, « Cybersécurité : d’une nécessité à une opportunité business », publiée sur LinkedIn. Six plans, un iPhone et un stabilisateur DJI. Je m’occupe aussi de deux pages LinkedIn, avec deux tons : l’un personnel, l’autre institutionnel.","## Ce que j’ai préparé","À partir de la veille cyber mensuelle, j’ai écrit une stratégie éditoriale et des séries de posts : trente-six pages de posts en trois mois, avec une idée de visuel pour chacun, pour une page de 292 abonnés, puis un calendrier éditorial de six mois à raison d’un post par semaine. L’entreprise ne les a pas diffusés : j’étais assistant chef de projet, pas community manager."],"links":[["Voir la vidéo","https://www.linkedin.com/posts/stephen-anderson-soahita-715a2b321_cybersaezcuritaez-deeptech-intelligenceartificielle-activity-7477662335428632576-yuJU"]],"facts":[["36","pages de posts préparées"],["6 mois","de calendrier éditorial"],["6","plans pour la vidéo"]]},{"id":"baume","tag":"Identité de marque","title":"Baume Anjara-Soa","img":"j3.jpg","st":"En vente","body":["Le baume est un produit artisanal, né d’une activité familiale et vendu à Madagascar. Depuis la France, à la demande de ma famille, j’en dessine l’identité.","## Ce que j’ai fait","J’ai créé le monogramme AS, l’étiquette, l’affiche et les flyers pour un salon à Tamatave en 2025, et j’ai pris toutes les photos du produit.","## Le contenu","J’ai prévu un calendrier éditorial de quatre semaines pour Facebook et TikTok, avec une stratégie centrée sur la fidélisation plutôt que sur la recherche de nouveaux clients.","La vente sur place revient à l’équipe familiale ; ma part, c’est l’image."],"facts":[["AS","monogramme"],["4","semaines de calendrier"]],"gallery":["baume_portrait.jpg"]},{"id":"slam","bg":"slam_scene.jpg","pos":"50% 50%","gallery":["slam_escalier.jpg"],"tag":"Prise de parole","title":"Slam","big":"Slam","c":["#B5651D","#13315C"],"st":"En pratique","body":["La prise de parole traverse tout ce que je fais : les discours d’accueil de l’association, ma présidence, mes propres textes.","J’écris du slam, avec de l’éloquence, des figures de style, des jeux de mots, une vérité brute mais poétique, des rimes internes, des pauses orales et des fins marquantes mais humaines.","Dans le slam musical, je fais le rythme à la guitare avec une amie pendant qu’une autre personne slame sur scène ; il m’arrive aussi de slamer moi-même en jouant de la guitare.","Cette voix se retrouve en ligne, sur Facebook, Instagram et TikTok, autour de la prise de parole, du slam, de la poésie et du récit."]}]},{"id":"tekwin","cat":"experiences","title":"Mon alternance chez Tekwin","sub":"Assistant chef de projet IT, de juillet 2025 à septembre 2026","items":[{"id":"tkvideo","img":"tekwin_alternance.jpg","logos":["tekwin","accelis"],"tag":"Vidéo · inédite","title":"Mon alternance chez Tekwin","st":"Nouveau","video":["tekwin_alternance.mp4","tekwin_alternance.jpg"],"body":["Une vidéo sur mon alternance chez Tekwin, où je suis assistant chef de projet IT, de juillet 2025 à septembre 2026.","Elle n’avait pas été publiée avant ce portfolio."]},{"id":"tk1","bg":"tk_gilet.jpg","pos":"50% 30%","gallery":["tk_fenetre.jpg"],"links":[["Voir l’interview","https://www.instagram.com/reel/DcmEHAbxEhL/"]],"logos":["tekwin","accelis"],"tag":"Le poste","title":"Assistant chef de projet IT","big":"Tek<br>win","c":["#946F22","#0B2545"],"st":"Terminé","body":["Tekwin est un prestataire de services informatiques et de cybersécurité installé à Ferrières-en-Brie, dans la H-Tech Valley, et fait partie du groupe Accelis. J’y suis assistant chef de projet IT, en alternance, de juillet 2025 à septembre 2026."]},{"id":"tk2","bg":"tk_bureau.jpg","pos":"50% 35%","gallery":["tk_dell.jpg"],"logos":["tekwin"],"tag":"Premier défi","title":"Odoo, à partir de zéro","big":"300","c":["#946F22","#13315C"],"st":"Terminé","body":["Odoo venait d’être mis en place à mon arrivée. Je suis devenu le premier de la société à l’utiliser, sans véritable formation, en partant d’un outil vide. Il m’a fallu environ trois mois pour comprendre à la fois le poste et l’outil.","## La migration","J’ai migré environ trois cents produits depuis l’ancien logiciel, SuperOps : produits configurés selon les consignes de ma responsable, clients créés, données croisées pour les factures, abonnements créés, documentation rédigée, configuration testée."],"facts":[["300","produits migrés"],["3 mois","pour maîtriser"]]},{"id":"tk3","bg":"tk_selfie.jpg","pos":"50% 55%","logos":["tekwin"],"tag":"Depuis janvier 2026","title":"Appels de courtoisie","big":"25<br>21<br>13","c":["#2F8F96","#0B2545"],"st":"En place","body":["Un bilan par client et par trimestre.","## La méthode","Le mail part un mois et demi avant, avec des créneaux modifiables. Une fois le créneau accepté, je prépare l’appel en relisant les contrats et les services du client. Sans réponse, je relance par téléphone vingt-quatre heures après le mail, puis j’envoie un message. Environ six clients sur dix ne répondent pas tout de suite.","## Le résultat","J’ai réalisé vingt-cinq appels : vingt et un clients ont accepté l’échange, et treize ont pris de nouveaux services après le deuxième bilan. J’y ai gagné une meilleure compréhension des besoins réels et des blocages. Avec plus de transparence, les clients s’ouvrent davantage à d’autres services, ou à tout centraliser chez Tekwin."],"facts":[["25","appels"],["21","acceptent"],["13","nouveaux services"]]},{"id":"tk4","bg":"tk_equipe.jpg","pos":"35% 55%","logos":["tekwin"],"tag":"Pour la suite","title":"Écrire pour celui qui vient après","big":"15","c":["#13315C","#946F22"],"st":"Livré","body":["J’écris pour que d’autres puissent reprendre après moi.","## Guide de procédures","Quinze sections : la routine, les appels avec scripts, les factures, Odoo, les appels de courtoisie et le suivi du chiffre d’affaires. Je l’ai mis en forme avec Claude.","## Rapports et recrutement","J’ai rédigé des rapports hebdomadaires depuis juillet 2025, ainsi qu’une offre d’emploi et une fiche de poste pour la personne qui me succédera. Tekwin les a acceptées."],"facts":[["15","sections du guide"],["1","fiche de poste"]]}]},{"id":"asso","cat":"experiences","title":"Mon association et mon école","sub":"Cofonder, présider, puis transmettre","items":[{"id":"isc1","bg":"isc_s1.jpg","pos":"50% 50%","logos":["iscamerica","iscam"],"tag":"Saison 1 · 2022 – 2023","title":"Isc’America : cofonder","big":"2022","c":["#3F6E9B","#13315C"],"st":"Terminé","body":["Isc’America est l’association étudiante de l’ISCAM autour de la culture américaine, de la prise de parole en public et de la pratique de l’anglais. Je l’ai cofondée en 2022 avec d’autres étudiants.","## Mon rôle","J’étais cofondateur et responsable communication : visuels, animation de la page, activités, premiers partenariats avec des écoles, des clubs d’anglais, des stands et des événements. C’est là que j’ai découvert la communication et la création de contenu.","## Les stands","Le 26 octobre 2022, à la journée des associations, notre premier stand était décoré de panneaux de villes américaines. Le 19 octobre 2023, le stand est passé en intérieur, avec une identité visuelle complète, un aigle peint et de la cuisine en direct. Les corn dogs étaient l’idée du responsable financier, pour alimenter la trésorerie ; l’aigle était une décision du comité, réalisée par des membres."]},{"id":"isc2","bg":"isc_s2.jpg","pos":"50% 45%","gallery":["isc_s2b.jpg","isc_plant.jpg","isc_stand.jpg","noel_selfie.jpg","noel_meals.jpg"],"logos":["iscamerica"],"tag":"Saison 2 · 2023 – 2024","title":"Isc’America : présider","big":"2023","c":["#3F6E9B","#0B2545"],"st":"Terminé","body":["En 2023, je suis devenu président.","## Thanksgiving · 23 novembre 2023","Environ vingt-cinq membres se sont réunis autour d’un repas partagé. J’ai ouvert la rencontre par un discours d’accueil sur l’idée centrale de la fête : le partage du moment et des échanges.","## Partage de repas de Noël · 23 décembre","À Ankadifotsy. L’idée du projet était la mienne et j’en ai dirigé l’organisation : planning, répartition des tâches, suivi avant, pendant et après. Une collecte de fonds a eu lieu les 20 et 21 décembre (la part à 12 000 Ar, soit environ 2,50 €). Plus de soixante-dix personnes ont reçu un repas.","## Iscamian’s Day · janvier 2024","« Planter des vies ! » : environ quatre-vingts membres, chacun plantant au moins un arbre, et un stand de milkshakes qui a récolté des fonds.","## Une soirée annulée","L’American Night Party du 23 février 2024 était préparée jusqu’au bout (autorisations, prestataires, acomptes) quand l’établissement l’a annulée à la dernière minute.","## Les publications","Le partage de repas a été renouvelé deux années de suite. Les deux publications Facebook sont liées ci-dessous."],"facts":[["70+","repas à Noël"],["80","membres, un arbre chacun"],["25","membres à Thanksgiving"]],"links":[["Partage de repas · publication 1","https://www.facebook.com/share/p/1D1qAnKpn3/"],["Partage de repas · publication 2","https://www.facebook.com/share/p/1JVsiwNnbv/"]]},{"id":"isc3","bg":"isc_s3.jpg","pos":"50% 50%","logos":["iscamerica"],"tag":"Saison 3 · 2024 – 2025","title":"Isc’America : transmettre","big":"2024","c":["#13315C","#3F6E9B"],"st":"En cours","body":["En 2024-2025, j’ai passé la présidence à mon successeur et je suis resté son conseiller. Avant chaque réunion, nous parlons des activités prévues pour les six séances suivantes : je donne mon avis, mes propositions et la manière dont j’avais conçu et planifié les miennes.","Je gère encore aujourd’hui la page Facebook de l’association."]},{"id":"referent","bg":"ref_attest.jpg","pos":"50% 30%","gallery":["ref_foret.jpg","ref_nuit.jpg","ref_equipe.jpg","iscam_stand.jpg"],"logos":["iscam"],"tag":"ISCAM · 2022 – 2024","title":"Élève référent","big":"2 ans","c":["#3F6E9B","#0B2545"],"st":"Terminé","body":["Pendant deux ans, en 2022-2023 et en 2023-2024, j’ai suivi à chaque fois deux ou trois classes, tout au long de l’année. Au total, plus de soixante-dix élèves.","## Ce que je faisais","Je les conseillais sur les démarches et les astuces de l’école, j’animais les pauses, j’organisais les tours de repas, je jouais au besoin le time keeper, je formais de petits groupes de discussion, et surtout j’écoutais.","## Les temps forts","Avec d’autres référents, j’ai encadré environ trois cents élèves de classes mélangées ; chaque référent y tenait un rôle selon son point fort. J’ai aussi participé à des salons étudiants, dont des salons d’étudiants internationaux.","Ce rôle est distinct de l’association que j’ai cofondée à la même époque."],"facts":[["2","ans"],["70+","élèves suivis"],["300","élèves aux temps forts"]]}]},{"id":"stages","cat":"experiences","title":"Mes deux stages à Madagascar","sub":"2022 et 2024","items":[{"id":"boa","bg":"boa.jpg","pos":"50% 55%","logos":["boa"],"tag":"Stage","title":"BOA Madagascar","big":"BOA","c":["#4E6B57","#13315C"],"st":"Terminé","body":["J’ai fait un stage de huit semaines à la banque BOA Elite Antaninarenina, en troisième année de licence à l’ISCAM. Il est devenu mon rapport de fin de licence 2024, intitulé « Contribution à l’amélioration de la gestion clientèle ».","## La clientèle Elite","BOA Elite accueille une clientèle haut de gamme : cadres d’institutions, diplomates, ministres, directeurs généraux, entrepreneurs et autres personnalités. Elle attend trois choses avant tout : un service impeccable, des traitements rapides et une confidentialité totale.","## Un cas concret","Un ministre doit renouveler sa carte bancaire mais n’a pas le temps de venir. Son représentant se présente avec une procuration, qui doit normalement être légalisée. Le client exige de la souplesse, la banque doit rester dans ses règles : mon rapport part de ce type de situation.","## Ce que mon rapport propose","Un catalogue de solutions, évaluées puis budgétisées : des procédures plus souples pour les demandes spéciales, un personnel formé, une équipe dédiée aux clients haut de gamme, des transactions mieux sécurisées, des procurations plus simples à suivre, et des outils numériques comme un assistant en ligne.","## Au quotidien","J’ai aussi travaillé aux côtés du responsable communication, qui m’a appris des méthodes et des raccourcis de graphisme. Ce stage m’a appris à écouter les clients et à rester discret."],"facts":[["8","semaines de stage"],["453","personnes interrogées"],["53","réponses au questionnaire"]]},{"id":"sos","bg":"q02.jpg","pos":"50% 30%","logos":["sos"],"tag":"Premier stage · 2022","title":"Groupe SOS Madagascar","big":"Groupe<br>SOS","small":1,"c":["#4E6B57","#071a33"],"st":"Terminé","body":["C’était mon premier stage, en première année de licence à l’ISCAM, du 25 avril au 20 mai 2022. Quatre semaines pour découvrir comment une entreprise fonctionne vraiment.","Le groupe SOS gère plusieurs sociétés : SOS, MAEXI Trading (matériel médical), EOLE (gaz industriels et médicaux) et MADAFLEX (emballages plastiques).","## Quatre semaines, plusieurs métiers","Transit et importation, stock, comptabilité, commercial, administration des ventes, puis ressources humaines. J’y ai vu qu’aucun service ne peut être pris à la légère : quand l’un s’arrête, les autres s’arrêtent aussi.","## La dernière semaine, aux ressources humaines","La plus utile pour moi. J’y ai suivi le recrutement, l’intégration des nouveaux, la mise à jour de l’organigramme et la gestion de la paie. Mon rapport de stage porte d’ailleurs sur ce travail.","## Ce que j’en retiens","Mettre en pratique ce que l’ISCAM enseigne, et voir ce que font réellement les employés au quotidien."],"facts":[["4","semaines"],["6","services visités"],["4","sociétés dans le groupe"]]}]},{"id":"etudes","cat":"formation","title":"Mon parcours d’études","sub":"De l’ISCAM à l’INSEEC","items":[{"id":"inseec","bg":"inseec.jpg","pos":"50% 35%","logos":["inseec"],"tag":"Depuis sept. 2026","title":"INSEEC · master 1","big":"INSEEC","c":["#C9A24B","#13315C"],"st":"En cours","body":["Je suis en master 1 en marketing, communication et stratégie de marque. Je pivote vers le marketing, le contenu de marque et la communication."]},{"id":"ebs2","bg":"m2_verre.jpg","pos":"60% 45%","gallery":["m2_balcon.jpg"],"links":[["Voir le témoignage","https://www.instagram.com/reel/DWy6lcGCGZz/"]],"logos":["ebs","ferrieres"],"tag":"Promotion 2026","title":"EBS × Ferrières · master 2","big":"M2","c":["#13315C","#946F22"],"st":"Promotion 2026","body":["Mon master 2 est un double diplôme avec Ferrières, promotion 2026 : le MSc Leadership in Hospitality Management, délivré avec European Business School. La première année se passe à EBS Paris, la deuxième à Ferrières-en-Brie.","Après le business à l’international, j’y découvre l’univers de l’hospitalité et du luxe : comment on conçoit un lieu et un concept, comment on pilote sa performance, et comment on fait vivre à un client une expérience qui compte. On y apprend par projets, masterclasses et missions de conseil.","Cette lecture complète celle de l’EBS : le manager qui voit grand, et celui qui soigne chaque détail de l’expérience."]},{"id":"memoire","bg":"q13.jpg","pos":"50% 35%","logos":["ebs"],"tag":"Mémoire de fin d’études · 2026","title":"Cohérence technologique et confiance consommateur","big":"Apple","small":1,"c":["#071a33","#3F6E9B"],"st":"Soutenu","body":["Mon mémoire de fin d’études, à l’EBS Paris, promotion 2026, porte sur Apple et sa promesse technologique : photo, vidéo et intelligence artificielle.","## La question","Ce qu’Apple promet sur ses iPhone correspond-il à ce que les utilisateurs vivent au quotidien ? Et cet écart, ou cette cohérence, change-t-il la confiance qu’ils accordent à la marque et leur fidélité, selon qu’ils appartiennent à la génération X, Y ou Z ?","## Le terrain","Des utilisateurs d’iPhone à Madagascar. Sur ce marché, l’iPhone est rare et coûteux : l’avoir est souvent un choix d’identité autant que d’usage. C’est ce qui rend la question intéressante.","## La démarche","Une revue de littérature en trois axes (promesse de marque, confiance et fidélité, différences entre générations), puis une enquête par questionnaire diffusée auprès de répondants à Madagascar, et une analyse statistique des réponses.","## Pourquoi ce sujet","Il réunit trois choses qui comptent pour moi : la marque, la communication et Madagascar. Il prolonge ma bascule vers le marketing et le brand content."]},{"id":"ebs1","bg":"ebs1.jpg","pos":"50% 45%","gallery":["ebs_mur.jpg"],"logos":["ebs"],"tag":"Paris · 2024 – 2025","title":"EBS Paris · master 1","big":"M1","c":["#13315C","#071a33"],"st":"Terminé","body":["J’ai fait mon master 1 en International Business Management à EBS Paris, après mon départ de Madagascar pour Paris. Tous les cours sont en anglais, ce qui fait progresser le mien, certifié au niveau C2.","J’y ai appris à lire une entreprise à l’échelle du monde : sa stratégie, ses finances, ses équipes, ses négociations. J’y ai aussi appris à diriger, à décider avec des données, et à travailler avec des personnes de cultures très différentes.","Ce qui m’y attire le plus : la marque et la communication digitale, et l’entrepreneuriat."]},{"id":"iscam","bg":"iscam1.jpg","pos":"50% 35%","proof":["diplome_licence.jpg"],"gallery":["iscam2.jpg","iscam3.jpg"],"logos":["iscam"],"tag":"Madagascar","title":"Licence en gestion","big":"ISCAM","c":["#4E6B57","#0B2545"],"st":"Terminé","body":["J’ai fait ma licence en gestion à l’ISCAM Business School, à Madagascar. C’est aussi là que se trouvent l’association et mon rôle d’élève référent.","## Le diplôme","Diplôme de licence en sciences de gestion, parcours Management et Développement d’Entreprise, obtenu en 2024.","## Le rapport de fin de licence","Il s’intitule « Contribution à l’amélioration de la gestion clientèle. Cas : BOA Elite Antaninarenina ». Je l’ai préparé pendant mon stage de huit semaines dans cette banque."],"facts":[["3 ans","de licence"],["2024","diplôme"]]},{"id":"itti","bg":"q05.jpg","pos":"60% 25%","proof":["certificat_c2.jpg"],"tag":"Anglais · juillet 2021","title":"Certificat d’anglais niveau C2","big":"C2","c":["#13315C","#946F22"],"st":"Obtenu","body":["Le 5 juillet 2021, j’ai obtenu le « Certificate of Superior Level English – C2 » de l’ITTI School of English (International TEFL Training Institute).","Le test porte sur les quatre compétences : parler, écouter, lire, écrire, avec en plus l’usage de la langue. C2 est le niveau le plus élevé du cadre européen.","Cette base nourrit tout ce que je fais avec l’anglais : Isc’America, Speak Up English Institute, le manuel « Let’s Speak English » et mes études en anglais à l’EBS."],"facts":[["C2","anglais"],["2021","certificat"]]}]},{"id":"comp","cat":"formation","title":"Mes outils","sub":"Matériel, logiciels et langues","items":[{"id":"outils","bg":"q04.jpg","pos":"50% 35%","tag":"Avec quoi je travaille","title":"Outils, matériel & logiciels","big":"Outils","c":["#13315C","#2F8F96"],"st":"Aujourd’hui","list":null,"body":["## Tout est fait par moi","Je tourne, je monte et je photographie moi-même. Ce portfolio et le site de Man in the Shadow, c’est aussi moi qui les ai faits.","## Matériel photo et vidéo","Pour la photo, un Sony A6400 avec un objectif 18-135 mm f/3.5-5.6, un objectif fixe 50 mm f/1.8, un flash Godox et mon trépied. Pour la vidéo, un iPhone 17 Pro monté sur un stabilisateur DJI Osmo Mobile 7P, avec son trépied.","## Son","Un micro-cravate DJI Mic Mini 2 pour ma voix, comme dans mon témoignage filmé en extérieur.","## Logiciels de création","Je monte mes vidéos sur CapCut, je retouche mes photos sur Photoshop et je crée mes visuels sur Canva, où je progresse.","## Réseaux et gestion","J’utilise Facebook, Instagram, TikTok et LinkedIn au quotidien, et Odoo et SuperOps chez Tekwin.","## Langues","Anglais niveau C2."]}]}];

function visual(it){
  if(it.video){const v=it.video;return `<figure class="vis video${it.vertical?' vert':''}"><video controls playsinline preload="metadata"${v[1]?` poster="img/${v[1]}"`:''}><source src="video/${v[0]}" type="video/mp4">Votre navigateur ne lit pas cette vidéo.</video></figure>`}
  if(it.shot) return `<figure class="vis phone${it.wide?' wide':''}"><img loading="lazy" decoding="async" src="img/${it.shot}" alt="${it.title}"></figure>`;
  if(it.img){const c=it.contain?' contain':'';return `<figure class="vis photo${c}"><img loading="lazy" decoding="async" src="img/${it.img}" alt="${it.title}"></figure>`;}
  const bg=it.bg?`background:linear-gradient(180deg,${it.c[0]}cc 0%,${it.c[0]}33 38%,${it.c[1]}f2 100%),url(img/${it.bg}) ${it.pos||'50% 30%'}/cover`:`background:linear-gradient(155deg,${it.c[0]},${it.c[1]})`;
  return `<figure class="vis typo${it.bg?' bgp':''}" style="${bg}"><div class="big${it.small||it.bg?' s':''}">${it.big}</div><figcaption>${it.tag}</figcaption></figure>`;
}
function body(it){
  const parts=(it.body||[]).map(p=>p.startsWith('## ')?`<h4>${p.slice(3)}</h4>`:`<p>${p}</p>`).join('');
  const list=it.list?`<ul>${it.list.map(x=>`<li>${x}</li>`).join('')}</ul>`:'';
  const facts=it.facts?`<div class="facts">${it.facts.map(f=>`<div><b>${f[0]}</b><span>${f[1]}</span></div>`).join('')}</div>`:'';
  const links=it.links?`<div class="links">${it.links.map(l=>`<a class="btn gold" target="_blank" rel="noopener" href="${l[1]}">${icoUrl(l[1])}${l[0]}</a>`).join('')}</div>`:'';
  const gal=it.gallery?`<div class="more">${it.gallery.map(g=>`<img loading="lazy" decoding="async" src="img/${g}" alt="">`).join('')}</div>`:'';
  const proof=it.proof?`<h4>La preuve</h4><div class="proof">${it.proof.map(g=>`<img loading="lazy" decoding="async" src="img/${g}" alt="Document officiel">`).join('')}</div>`:'';
  return parts+list+facts+links+gal+proof;
}
function tile(it,i){
  let inner,cls='tile rv';
  if(it.shot){cls+=' phoneT';inner=`<div class="bgi"><img loading="lazy" decoding="async" src="img/${it.shot}" alt=""></div>`}
  else if(it.img){if(it.contain)cls+=' contain';inner=`<div class="bgi"><img loading="lazy" decoding="async" src="img/${it.img}" alt=""></div>`}
  else if(it.bg){inner=`<div class="bgi" style="background-image:url(img/${it.bg});background-position:${it.pos||'50% 30%'}"></div>`}
  else inner=`<div class="bgi" style="background:linear-gradient(155deg,${it.c[0]},${it.c[1]})"></div>`;
  const big=(!it.shot&&!it.img&&it.big&&!/<br>/.test(it.big)&&it.big.length<=7)?`<div class="bigt">${it.big}</div>`:'';
  return `<a class="${cls}" style="--d:${(i%4)*.07}s" href="#/c/${it._cat}/${it.id}">${inner}${it.st?`<span class="st${it.prep?' prep':''}">${it.st}</span>`:''}${tlogos(it)}${big}<div class="cap"><div class="tag">${it.tag}</div><div class="ttl">${it.title}</div></div></a>`;
}

function introInit(){
  let seen=false;try{seen=sessionStorage.getItem('intro')==='1'}catch(e){}
  const h=location.hash.replace(/^#\/?/,'');
  if(seen||h||(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches))return;
  const el=document.createElement('div');
  el.id='intro';el.setAttribute('role','dialog');el.setAttribute('aria-label','Introduction');
  el.innerHTML='<div class="ig"></div><button class="iskip" type="button">Passer</button>'
   +'<div class="itx"><p class="i1">Un CV dit ce qu’on a fait.</p><p class="i2">Cette page raconte qui je suis.</p><h1 class="i3">Au-delà d’un CV</h1></div>'
   +'<div class="il"></div><button class="ibtn" type="button">Me découvrir <span>→</span></button>';
  document.body.appendChild(el);document.documentElement.classList.add('introing');
  let done=false;
  function close(){
    if(done)return;done=true;
    try{sessionStorage.setItem('intro','1')}catch(e){}
    el.classList.add('out');document.documentElement.classList.remove('introing');
    setTimeout(()=>{el.remove()},1100);
  }
  el.querySelector('.ibtn').onclick=close;el.querySelector('.iskip').onclick=close;
  addEventListener('keydown',function k(e){if(e.key==='Escape'||e.key==='Enter'){close();removeEventListener('keydown',k)}});
  setTimeout(close,14000);
}

const GH_REPO='andersonsoahita-hash/Stephen-Portfolio',GH_FILE='entretiens.json';
function adminPage(){
  app.innerHTML=`<div class="page"><div class="apage contactp"><div class="crumbs"><a href="#/">Accueil</a> · Gestion des entretiens</div>
  <div class="kick">Espace privé</div><h1>Mes entretiens</h1>
  <p class="intro">Ajoutez ici vos entretiens ou vos indisponibilités : ils apparaissent comme créneaux indisponibles dans le calendrier public, sans motif ni nom de société. Les entretiens ne peuvent se placer que sur vos périodes en entreprise.</p>
  <section class="adm" id="adm"></section></div>${foot()}</div>`;
  let tok='';try{tok=sessionStorage.getItem('gh_tok')||''}catch(e){}
  tok?adminLoad(tok):adminLogin('');
}
function adminLogin(msg){
  $('#adm').innerHTML=`<form class="cform" id="alog"><h3>Connexion</h3>
   <p class="fnote">Collez votre jeton GitHub. Il reste dans cet onglet uniquement et disparaît à la fermeture.</p>
   <label>Jeton GitHub<input type="password" name="tok" autocomplete="current-password" required></label>
   <button class="btn gold" type="submit">Se connecter</button><p id="ast" class="err">${msg||''}</p>
   <details class="fnote"><summary>Créer le jeton (une seule fois)</summary><ol>
    <li>GitHub → votre photo → Settings → Developer settings → Personal access tokens → Fine-grained tokens → Generate new token.</li>
    <li>Repository access : « Only select repositories » → Stephen-Portfolio.</li>
    <li>Permissions → Repository permissions → Contents : Read and write.</li>
    <li>Générez, copiez le jeton et collez-le ici.</li></ol></details></form>`;
  $('#alog').addEventListener('submit',e=>{e.preventDefault();const t=e.target.elements.tok.value.trim();if(!t)return;try{sessionStorage.setItem('gh_tok',t)}catch(x){}adminLoad(t)});
}
function ghHead(tok){return{'Authorization':'Bearer '+tok,'Accept':'application/vnd.github+json'}}
function adminLoad(tok){
  $('#adm').innerHTML='<p class="fnote">Chargement…</p>';
  fetch('https://api.github.com/repos/'+GH_REPO+'/contents/'+GH_FILE+'?ref=main&t='+Date.now(),{headers:ghHead(tok)}).then(r=>{
    if(r.status===404)return{list:[],sha:null};
    if(!r.ok)throw new Error(String(r.status));
    return r.json().then(j=>({list:JSON.parse(atob(j.content.replace(/\n/g,''))||'[]'),sha:j.sha}));
  }).then(s=>adminDraw(tok,s.list,s.sha)).catch(e=>{try{sessionStorage.removeItem('gh_tok')}catch(x){}adminLogin('Connexion refusée ('+e.message+'). Vérifiez le jeton et ses droits sur le dépôt.')});
}
function adminDraw(tok,list,sha,msg,ok){
  list.sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));
  const today=iso(new Date());
  const rows=list.map((x,i)=>`<li${x.date<today?' class="past"':''}><span><b>${frDate(x.date)}</b> · ${x.start==='00:00'&&x.end==='24:00'?'journée entière':x.start+' – '+x.end}${x.off?' · indisponible':''}</span><button type="button" class="btn ghost" data-i="${i}">Supprimer</button></li>`).join('')||'<li class="none">Aucun entretien enregistré.</li>';
  const slots=[];for(let h=7;h<=20;h++){['00','30'].forEach(m=>slots.push(String(h).padStart(2,'0')+':'+m))}
  $('#adm').innerHTML=`<div class="admgrid"><div class="cform"><h3>Entretiens prévus</h3><ul class="alist">${rows}</ul></div>
   <form class="cform" id="aadd"><h3>Ajouter</h3><label>Type<select name="kind"><option value="i">Entretien</option><option value="o">Indisponible (sans motif)</option></select></label>
    <label>Jour<input type="date" name="date" required min="${today}"></label>
    <div class="row3"><label>Début<select name="start">${slots.map(s=>`<option${s==='10:00'?' selected':''}>${s}</option>`).join('')}</select></label>
    <label>Durée<select name="len"><option value="30">30 min</option><option value="45">45 min</option><option value="60" selected>1 h</option><option value="90">1 h 30</option><option value="120">2 h</option><option value="0">Journée entière</option></select></label><span></span></div>
    <button class="btn gold" type="submit">Ajouter</button>
    <p id="ast" class="${ok?'ok':'err'}">${msg||''}</p>
    <p class="fnote">Le site public se met à jour en une à deux minutes après chaque modification.</p>
    <button type="button" class="btn ghost" id="aout">Se déconnecter</button></form></div>`;
  $('#aout').onclick=()=>{try{sessionStorage.removeItem('gh_tok')}catch(e){}adminLogin('')};
  document.querySelectorAll('.alist button').forEach(b=>b.onclick=()=>{const n=list.slice();n.splice(+b.dataset.i,1);adminSave(tok,n,sha,'Entretien supprimé.')});
  $('#aadd').addEventListener('submit',e=>{
    e.preventDefault();const f=e.target,d=f.elements.date.value,s=f.elements.start.value,len=+f.elements.len.value;
    if(!d)return;
    const off=f.elements.kind.value==='o',tp=ALT[d];
    if(!off&&tp!=='E'){$('#ast').className='err';$('#ast').textContent=tp?'Impossible : ce jour est '+(tp==='F'?'en période école':tp==='H'?'férié':'un jour d’examen ou de soutenance')+'. Un entretien se place sur une période en entreprise.':'Ce jour est hors du calendrier d’alternance.';return}
    const full=len===0,a=full?0:mins(s),b=full?1440:a+len,end=fmt(b);
    const clash=list.find(x=>x.date===d&&a<mins(x.end)&&b>mins(x.start));
    if(clash){$('#ast').className='err';$('#ast').textContent='Cet horaire chevauche un entretien déjà prévu ce jour-là ('+clash.start+' – '+clash.end+').';return}
    adminSave(tok,list.concat([off?{date:d,start:fmt(a),end:end,off:1}:{date:d,start:fmt(a),end:end}]),sha,off?'Indisponibilité ajoutée.':'Entretien ajouté.');
  });
}
function adminSave(tok,list,sha,okMsg){
  $('#ast').className='';$('#ast').textContent='Enregistrement…';
  const body={message:'Mise à jour des entretiens',content:btoa(JSON.stringify(list,null,1)+'\n'),branch:'main'};if(sha)body.sha=sha;
  fetch('https://api.github.com/repos/'+GH_REPO+'/contents/'+GH_FILE,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},ghHead(tok)),body:JSON.stringify(body)})
   .then(r=>{if(!r.ok)throw new Error(String(r.status));return r.json()})
   .then(j=>adminDraw(tok,list,j.content.sha,okMsg,true))
   .catch(e=>{$('#ast').className='err';$('#ast').textContent='Échec de l’enregistrement ('+e.message+'). Rechargez la page et réessayez.'});
}

  document.body.appendChild(o);o.querySelector('button').onclick=()=>o.remove();
}
const fmt=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
function thanks(r,mail){
  const o=document.createElement('div');o.className='thx';o.setAttribute('role','dialog');o.setAttribute('aria-modal','true');
  const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
  let conf='';for(let i=0;i<36;i++){const a=i/36*360,dist=110+Math.random()*180;conf+=`<i style="--x:${(Math.cos(a*Math.PI/180)*dist).toFixed(0)}px;--y:${(Math.sin(a*Math.PI/180)*dist).toFixed(0)}px;--r:${(Math.random()*540-270).toFixed(0)}deg;--dl:${(Math.random()*.25).toFixed(2)}s;--c:${['#c9a45c','#fff','#7fb2ff','#9fe3b0'][i%4]}"></i>`}
  o.innerHTML=`<div class="thxbox"><div class="thxc">${conf}<svg viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="24"/><path d="M15 27l8 8 15-17"/></svg></div>
  <h2>Merci, votre créneau est réservé !</h2>
  <p class="thxp">Hâte de vous rencontrer.</p>
  <div class="thxr"><b>${esc(r.quand)}</b><span>${esc(r.dur)} · ${esc(r.mode)}</span><span>${esc(r.where)}</span></div>
  <p class="thxs">Vous recevez à l’instant une copie de tous les détails à <b>${esc(mail)}</b>. Pensez à regarder vos courriers indésirables si elle tarde.</p>
  <div class="thxb"><a class="btn gold" href="#/">Retour à l’accueil</a><a class="btn ghost" href="#/c/realisations">Voir mes réalisations</a></div></div>`;
  document.body.appendChild(o);const close=()=>o.remove();o.querySelectorAll('a').forEach(a=>a.addEventListener('click',close));
  addEventListener('keydown',function k(e){if(e.key==='Escape'){close();removeEventListener('keydown',k)}});
}
function drawExt(){
  const f=$('#cf');if(!f)return;const m=f.querySelector('[name=mode]').value,box=$('#cext');
  box.innerHTML=m==='Visioconférence'
   ?'<label>Lien de visioconférence <em>(facultatif)</em><input name="link" type="text" inputmode="url" autocomplete="off" placeholder="Lien Teams, Google Meet, Zoom…"></label><p class="hint">Collez votre lien Teams ou celui de l’outil que vous utilisez. Sans lien, je vous en propose un.</p>'
   :m==='Téléphone'
   ?'<label>Numéro à appeler<input name="phone" type="tel" required autocomplete="tel" inputmode="tel" placeholder="06 00 00 00 00"></label>'
   :'<label>Adresse du rendez-vous<input name="addr" required autocomplete="street-address" placeholder="Numéro, rue, code postal, ville"></label><p class="hint">Indiquez le lieu exact, avec l’étage ou l’accueil si besoin.</p>';
}

function chapter(c){
  const d=CATS[c],cv=COVER[c],rows=catRows(c);
  const tabs=rows.length>1?`<div class="ctabs">${rows.map(r=>`<a href="#/c/${c}" data-sec="${r.id}">${r.title}</a>`).join('')}</div>`:'';
  const secs=rows.map(r=>`<section class="csec" id="s-${r.id}"><div class="ph rv"><h3>${r.title}</h3><span>${r.sub}</span></div><div class="grid">${r.items.map(tile).join('')}</div></section>`).join('');
  app.innerHTML=`<div class="page"><header class="chead"><img loading="lazy" decoding="async" src="img/${cv[0]}" style="object-position:${cv[1]}" alt=""><div class="wrap"><div class="crumbs"><a href="#/">Accueil</a> · ${d.k}</div><div class="kick">${d.k}</div><h1>${d.h||d.t}</h1><p class="intro">${d.i}</p></div></header>${tabs}<div class="cbody">${secs}</div>${nextChap(c)}${foot()}</div>`;
  document.querySelectorAll('.ctabs a').forEach(a=>a.onclick=e=>{e.preventDefault();const t=$('#s-'+a.dataset.sec);scrollTo({top:t.getBoundingClientRect().top+scrollY-110,behavior:'smooth'})});
}
function article(id){
  const it=ITEMS[id];if(!it)return home();
  const c=it._cat,list=catItems(c),i=list.indexOf(it),pv=list[i-1],nx=list[i+1];
  const logos=(it.logos||[]).length?`<div class="logos">${it.logos.map(l=>`<img class="${l==='tekwin'?'dk':''}" src="img/logo_${l}.png" alt="logo ${l}">`).join('')}</div>`:'';
  const pn=x=>x?`<a class="${x===nx?'nx':'pv'}" href="#/c/${c}/${x.id}"><small>${x===nx?'Suivant →':'← Précédent'}</small><b>${x.title}</b></a>`:`<a class="ph0"></a>`;
  app.innerHTML=`<div class="page"><div class="apage"><a class="backbtn" href="#/c/${c}">← ${CATS[c].t}</a><div class="crumbs"><a href="#/">Accueil</a> · <a href="#/c/${c}">${CATS[c].t}</a> · ${it._row.title}</div>
  <article class="art${it.video?' hasv'+(it.vertical?' vert':''):''}" id="a-${it.id}">${visual(it)}<div class="txt2">${logos}<div class="kick">${it.tag}</div><h4 class="t">${it.title}</h4><span class="badge${it.prep?' prep':''}">${it.st}</span>${body(it)}</div></article></div>
  <div class="pn">${pn(pv)}${pn(nx)}</div>${nextChap(c)}${foot()}</div>`;
}
let io;
function reveal(){
  if(io)io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12,rootMargin:'0px 0px -6% 0px'});
  document.querySelectorAll('.rv').forEach(el=>io.observe(el));
}
try{history.scrollRestoration='manual'}catch(e){}
function toTop(){const d=document.documentElement;d.style.scrollBehavior='auto';window.scrollTo({top:0,left:0,behavior:'instant'});d.scrollTop=0;document.body.scrollTop=0;if(document.activeElement&&document.activeElement.blur)document.activeElement.blur()}
function route(){
  const h=location.hash.replace(/^#\/?/,'');const p=h.split('/').filter(Boolean);
  let cur='';
  if(p[0]==='c'&&CATS[p[1]]){cur=p[1];p[2]&&ITEMS[p[2]]?article(p[2]):chapter(p[1])}
  else if(p[0]==='contact')contactPage();else if(p[0]==='admin')adminPage();else home();
  document.querySelectorAll('nav ul a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#/c/'+cur));
  toTop();reveal();spy();requestAnimationFrame(toTop)
}
const bar=$('#bar');
function spy(){
  const h=document.documentElement.scrollHeight-innerHeight;
  bar.style.width=(h>0?Math.min(100,scrollY/h*100):0)+'%';
  $('#nav').classList.toggle('solid',scrollY>60);
  const ph=document.querySelector('.hero .photo');if(ph&&scrollY<innerHeight)ph.style.transform=`translateY(${scrollY*.12}px)`;
  const secs=[...document.querySelectorAll('.csec')];
  if(secs.length){let cur=secs[0].id;secs.forEach(s=>{if(s.getBoundingClientRect().top<150)cur=s.id});
    document.querySelectorAll('.ctabs a').forEach(a=>a.classList.toggle('on','s-'+a.dataset.sec===cur))}
}
let tick=false;addEventListener('scroll',()=>{if(!tick){tick=true;requestAnimationFrame(()=>{tick=false;spy()})}},{passive:true});
addEventListener('hashchange',route);
introInit();
route();

</script>
</body>
</html>
